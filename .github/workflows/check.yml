name: Check static site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro90-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Zola 0.23.4
        run: |
          curl --fail --location --retry 3 --output /tmp/zola.tar.gz https://github.com/getzola/zola/releases/download/v0.23.4/zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz
          echo '54d1a347781b2f32330914fcc02def81c7e3ddb6111b36d1cc89c06557aed1de  /tmp/zola.tar.gz' | sha256sum --check
          tar -xzf /tmp/zola.tar.gz -C /tmp
          sudo install /tmp/zola /usr/local/bin/zola
      - name: Validate and build
        run: |
          bash scripts/build_pages.sh
          CF_PAGES=1 ASTRO90_BUILD_MODE=site CF_PAGES_BRANCH=ci-preview CF_PAGES_URL=https://ci-preview.astro90.pages.dev bash scripts/build_pages.sh .local/pages-preview
      - name: Validate closed setup build
        run: |
          CF_PAGES=1 bash scripts/build_pages.sh .local/pages-preview
          diff -qr scripts/cloudflare-bootstrap .local/pages-preview
