name: Check static site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Zola 0.23.4
        run: |
          curl --fail --location --retry 3 --output /tmp/zola.tar.gz https://github.com/getzola/zola/releases/download/v0.23.4/zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz
          echo '54d1a347781b2f32330914fcc02def81c7e3ddb6111b36d1cc89c06557aed1de  /tmp/zola.tar.gz' | sha256sum --check
          tar -xzf /tmp/zola.tar.gz -C /tmp
          sudo install /tmp/zola /usr/local/bin/zola
      - name: Validate and build
        run: |
          zola check --skip-external-links
          zola build
          python3 scripts/check_site.py
